<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우주 총게임</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
        background: radial-gradient(circle at top, #111827, #020617 72%);
        color: #e2e8f0;
      }

      .container {
        width: min(94vw, 620px);
        display: grid;
        gap: 12px;
      }

      .panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.28);
      }

      .panel p {
        margin: 0;
        font-size: 14px;
      }

      .score {
        color: #38bdf8;
        font-weight: 700;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 8px 12px;
        background: #22c55e;
        color: #052e16;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover {
        filter: brightness(1.07);
      }

      canvas {
        width: 100%;
        aspect-ratio: 4 / 5;
        border-radius: 14px;
        background: linear-gradient(180deg, #020617, #0b1120);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 10px 28px rgba(2, 6, 23, 0.55);
      }

      .guide {
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="panel">
        <p>점수: <span class="score" id="score">0</span></p>
        <p>최고 점수: <span class="score" id="best">0</span></p>
        <button id="restart" type="button">다시 시작</button>
      </section>
      <canvas id="board" width="560" height="700" aria-label="우주 총게임 화면"></canvas>
      <p class="guide">← → 또는 A/D: 이동 · 스페이스: 발사 · 적에게 닿으면 게임 오버</p>
    </main>

    <script>
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const restartBtn = document.getElementById("restart");

      const input = { left: false, right: false, shoot: false };

      let animationId;
      let lastTime = 0;
      let spawnTimer = 0;
      let shootCooldown = 0;
      let score = 0;
      let bestScore = Number(localStorage.getItem("shooter-best-score")) || 0;
      let gameOver = false;

      const player = { x: canvas.width / 2, y: canvas.height - 70, width: 44, height: 26, speed: 330 };
      let bullets = [];
      let enemies = [];
      let stars = [];

      bestEl.textContent = String(bestScore);

      function resetGame() {
        cancelAnimationFrame(animationId);
        score = 0;
        scoreEl.textContent = "0";
        gameOver = false;
        spawnTimer = 0;
        shootCooldown = 0;
        lastTime = 0;
        player.x = canvas.width / 2;
        bullets = [];
        enemies = [];
        stars = Array.from({ length: 70 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 1,
          speed: Math.random() * 30 + 25,
        }));
        animationId = requestAnimationFrame(loop);
      }

      function spawnEnemy() {
        const size = 24 + Math.random() * 18;
        enemies.push({
          x: Math.random() * (canvas.width - size),
          y: -size,
          size,
          speed: 85 + Math.random() * 80 + Math.min(score, 250) * 0.25,
          drift: (Math.random() - 0.5) * 60,
        });
      }

      function update(delta) {
        if (gameOver) return;

        if (input.left) player.x -= player.speed * delta;
        if (input.right) player.x += player.speed * delta;
        player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

        shootCooldown -= delta;
        if (input.shoot && shootCooldown <= 0) {
          bullets.push({ x: player.x + player.width / 2 - 3, y: player.y - 12, width: 6, height: 14, speed: 520 });
          shootCooldown = 0.18;
        }

        bullets.forEach((bullet) => {
          bullet.y -= bullet.speed * delta;
        });
        bullets = bullets.filter((bullet) => bullet.y + bullet.height > 0);

        spawnTimer += delta;
        const spawnDelay = Math.max(0.22, 0.8 - score * 0.0025);
        while (spawnTimer >= spawnDelay) {
          spawnEnemy();
          spawnTimer -= spawnDelay;
        }

        enemies.forEach((enemy) => {
          enemy.y += enemy.speed * delta;
          enemy.x += enemy.drift * delta;
          if (enemy.x <= 0 || enemy.x + enemy.size >= canvas.width) {
            enemy.drift *= -1;
          }
        });

        for (let e = enemies.length - 1; e >= 0; e -= 1) {
          const enemy = enemies[e];
          for (let b = bullets.length - 1; b >= 0; b -= 1) {
            const bullet = bullets[b];
            if (
              bullet.x < enemy.x + enemy.size &&
              bullet.x + bullet.width > enemy.x &&
              bullet.y < enemy.y + enemy.size &&
              bullet.y + bullet.height > enemy.y
            ) {
              bullets.splice(b, 1);
              enemies.splice(e, 1);
              score += 10;
              scoreEl.textContent = String(score);
              if (score > bestScore) {
                bestScore = score;
                bestEl.textContent = String(bestScore);
                localStorage.setItem("shooter-best-score", String(bestScore));
              }
              break;
            }
          }
        }

        enemies = enemies.filter((enemy) => enemy.y < canvas.height + enemy.size);

        for (const enemy of enemies) {
          const hitPlayer =
            enemy.x < player.x + player.width &&
            enemy.x + enemy.size > player.x &&
            enemy.y < player.y + player.height &&
            enemy.y + enemy.size > player.y;
          const reachedBottom = enemy.y + enemy.size >= canvas.height;
          if (hitPlayer || reachedBottom) {
            gameOver = true;
            break;
          }
        }

        stars.forEach((star) => {
          star.y += star.speed * delta;
          if (star.y > canvas.height) {
            star.y = -star.size;
            star.x = Math.random() * canvas.width;
          }
        });
      }

      function drawBackground() {
        ctx.fillStyle = "#030712";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.forEach((star) => {
          ctx.fillStyle = "rgba(226, 232, 240, 0.75)";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawPlayer() {
        ctx.fillStyle = "#22d3ee";
        ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y - 8);
        ctx.lineTo(player.x + player.width, player.y + player.height);
        ctx.lineTo(player.x, player.y + player.height);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#a5f3fc";
        ctx.fillRect(player.x + player.width / 2 - 4, player.y + 3, 8, 14);
      }

      function drawBullets() {
        ctx.fillStyle = "#fef08a";
        bullets.forEach((bullet) => {
          ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
        });
      }

      function drawEnemies() {
        enemies.forEach((enemy) => {
          ctx.fillStyle = "#fb7185";
          ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
          ctx.fillStyle = "#fecdd3";
          ctx.fillRect(enemy.x + 5, enemy.y + 5, enemy.size - 10, 6);
        });
      }

      function drawOverlay() {
        if (!gameOver) return;
        ctx.fillStyle = "rgba(2, 6, 23, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f8fafc";
        ctx.textAlign = "center";
        ctx.font = "bold 42px sans-serif";
        ctx.fillText("게임 오버", canvas.width / 2, canvas.height / 2 - 14);
        ctx.font = "20px sans-serif";
        ctx.fillText("다시 시작 버튼으로 재도전!", canvas.width / 2, canvas.height / 2 + 28);
      }

      function draw() {
        drawBackground();
        drawPlayer();
        drawBullets();
        drawEnemies();
        drawOverlay();
      }

      function loop(timestamp) {
        const delta = Math.min((timestamp - lastTime) / 1000 || 0, 0.034);
        lastTime = timestamp;

        update(delta);
        draw();

        animationId = requestAnimationFrame(loop);
      }

      function setInput(event, pressed) {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", "a", "d", " ", "spacebar"].includes(key) || event.code === "Space") {
          event.preventDefault();
        }

        if (key === "arrowleft" || key === "a") input.left = pressed;
        if (key === "arrowright" || key === "d") input.right = pressed;
        if (key === " " || key === "spacebar" || event.code === "Space") input.shoot = pressed;
      }

      window.addEventListener("keydown", (event) => setInput(event, true));
      window.addEventListener("keyup", (event) => setInput(event, false));
      restartBtn.addEventListener("click", resetGame);

      resetGame();
    </script>
  </body>
</html>
